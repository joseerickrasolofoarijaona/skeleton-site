<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Découvrez les services proposés par Honey Group."
    >

    <meta
        name="author"
        content="Honey Group"
    >

    <title>Service - Honey Group</title>


    <link
        rel="stylesheet"
        href="../assets/css/reset.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/variables.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/style.css"
    >

    <link
        rel="stylesheet"
        href="../assets/css/responsive.css"
    >

</head>


<body>


    <!-- =========================
         NAVIGATION
         ========================= -->

    <div id="navbar"></div>


    <main>


        <!-- =========================
             PRESENTATION DU SERVICE
             ========================= -->

        <section class="hero">

            <div class="container">


                <p
                    class="hero-label"
                    id="service-label"
                >
                    Service
                </p>


                <h1 id="service-title">
                    Service
                </h1>


                <p
                    class="hero-description"
                    id="service-description"
                >
                    Description du service.
                </p>


            </div>

        </section>


        <!-- =========================
             DETAILS DU SERVICE
             ========================= -->

        <section class="section">

            <div class="container">


                <div class="section-header">

                    <p class="section-label">
                        Notre expertise
                    </p>


                    <h2>
                        Ce que nous proposons
                    </h2>

                </div>


                <div class="card">

                    <p id="service-details">
                        Découvrez les détails de notre service.
                    </p>

                </div>


            </div>

        </section>


        <!-- =========================
             CTA
             ========================= -->

        <section class="section section-light">

            <div class="container">


                <div class="cta">


                    <h2>
                        Vous avez un projet ?
                    </h2>


                    <p>
                        Contactez-nous pour discuter
                        de vos besoins.
                    </p>


                    <a
                        href="contact.html"
                        class="btn btn-primary"
                    >
                        Nous contacter
                    </a>


                </div>


            </div>

        </section>


    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <div id="footer"></div>


    <!-- =========================
         JAVASCRIPT
         ========================= -->

    <script src="../data/content.js"></script>

    <script src="../assets/js/main.js"></script>


</body>

</html>
